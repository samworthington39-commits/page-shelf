name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release signing key
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/page-shelf-release.jks"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/page-shelf-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "page-shelf-${GITHUB_REF_NAME}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: page-shelf-*-arm64.apk
          if-no-files-found: error

  docker:
    name: Publish backend container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/page-shelf:latest
            ghcr.io/${{ github.repository_owner }}/page-shelf:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/page-shelf:${{ steps.version.outputs.number }}
          labels: |
            org.opencontainers.image.title=Page Shelf
            org.opencontainers.image.description=Page Shelf NAS library manager backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: Publish GitHub Release
    needs:
      - android
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Build Docker deployment package
        shell: bash
        run: |
          package="page-shelf-${GITHUB_REF_NAME}-docker"
          mkdir -p "dist/$package"
          cp deploy/compose.yaml deploy/.env.example deploy/README.md "dist/$package/"
          (
            cd dist
            zip -r "$package.zip" "$package"
            sha256sum "page-shelf-${GITHUB_REF_NAME}-arm64.apk" "$package.zip" > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/page-shelf-*-arm64.apk \
            dist/page-shelf-*-docker.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "页架 Page Shelf ${GITHUB_REF_NAME} | NAS 图书管理器 / NAS Library Manager" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
