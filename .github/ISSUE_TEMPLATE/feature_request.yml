name: 功能建议
description: 提议符合私人阅读场景的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 描述当前遇到的问题，而不只是期望的按钮或实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已尝试的现有功能、绕过方式或其他设计。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
        - label: 该建议不要求上传或分享受版权保护的书籍内容。
          required: true
