name: Bug 报告
description: 报告可以稳定复现的功能问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请使用 Security 页面私密报告，不要在这里公开。
  - type: input
    id: version
    attributes:
      label: 版本
      description: APK 版本、Git commit 或 Docker 镜像版本。
      placeholder: 1.0.8 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 模块
      options:
        - Android App
        - 后端 API
        - 网页管理后台
        - Docker/部署
        - 文档/许可证
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Android/设备、服务器系统、Docker、浏览器等版本。不要包含密码或 Token。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与日志
      description: 请先移除书名、路径、IP、密码、Token 和其他私人内容。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我没有在报告中包含凭证、书籍内容或其他私人数据。
          required: true
