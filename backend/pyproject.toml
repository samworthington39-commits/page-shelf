[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "page-shelf-api"
version = "1.1.0"
description = "Self-hosted TXT, EPUB, MOBI and PDF library with browser and Android readers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.134,<0.142",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy>=2.0.51,<2.1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.13.3,<7",
  "pymupdf>=1.26,<2",
  "defusedxml>=0.7.1,<1",
  "mobi==0.4.1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
