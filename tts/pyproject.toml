[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "page-shelf-qwen-tts"
version = "0.2.0"
description = "Standalone Qwen3-TTS service for Page Shelf"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pydantic-settings>=2.8,<3",
    "soundfile>=0.12,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
qwen = [
    "qwen-tts==0.1.1",
]
openvino = [
    "openvino==2025.4.1",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["page_shelf_tts*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
